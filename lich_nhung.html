<title>Lịch làm việc</title>
<!-- Bản nhúng của Lịch làm việc: dùng trong <iframe> của trang khác. Dữ liệu lấy từ API lịch (CORS mở), không cần đăng nhập để xem. -->
<link rel="stylesheet" href="crck.css?v=10">

<style>
:root{

// Bản nhúng xem lịch thật ngay (không để chế độ dữ liệu mẫu); người xem vẫn bật lại được bằng nút "Dữ liệu mẫu"
LICH._S.demo = false;
