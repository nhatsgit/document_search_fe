<style>
/* Tên biến riêng của trang, trỏ sang bộ màu CRCK trong crck.css */
:root{
  --nen:var(--page); --the:var(--mau-card); --vien:var(--mau-line); --vien-2:var(--vach); --o:var(--border-strong);
  --chu:var(--mau-ink); --chu-2:var(--ink-phu); --chu-3:var(--muted); --chu-4:var(--faint);
  --navy:var(--brand-700); --xanh:var(--brand-700); --xanh-dam:var(--brand); --nut:var(--brand); --xanh-nhat:var(--brand-100);
  --seg:var(--gray-bg); --nhat:var(--soft); --nen-o:var(--soft);
  --lua:var(--brand); --cam:var(--gold); --do:var(--bad-fg);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--nen);color:var(--chu);font-family:var(--font);font-size:14.5px;line-height:1.5}
a{color:var(--xanh)}a:hover{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.so{font-variant-numeric:tabular-nums}

.khung{display:flex;flex-direction:column;gap:16px}

/* ---------- thành phần chung ---------- */
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px}
.the-dem{padding:14px 16px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.nhe{font-weight:500}
.tt-loi{background:var(--bad-bg);color:var(--bad-fg)}.tt-qua{background:var(--warn-bg);color:var(--warn-fg)}.tt-lech{background:var(--info-bg);color:var(--info-fg)}
.tt-giu{background:var(--info-bg);color:var(--info-fg)}.tt-dung{background:var(--ok-bg);color:var(--ok-fg)}.tt-xong{background:var(--gray-bg);color:var(--chu-3)}
.c-den{background:var(--xanh-nhat);color:var(--xanh)}.c-di{background:var(--warn-bg);color:var(--warn-fg)}.c-giu{background:var(--info-bg);color:var(--info-fg)}
.nut{padding:8px 14px;min-height:38px;border-radius:8px;border:1px solid var(--o);background:var(--the);color:var(--chu);cursor:pointer;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nut:hover{border-color:var(--border-strong)}
.nut.chon{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:600}
.nut.tron{padding:6px 12px;min-height:34px;border-radius:99px;font-size:13px}
.nut.chinh{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.nut.xanh{background:var(--nut);border-color:var(--nut);color:#fff;font-weight:600}
.nut.cam{border-color:var(--cam);background:var(--warn-bg);color:var(--warn-fg);font-weight:600}
.nut.loc{border-color:var(--xanh);background:var(--xanh-nhat);color:var(--xanh)}
.nut:disabled{opacity:.55;cursor:not-allowed}
.seg{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:10px}
.seg button{padding:8px 14px;min-height:36px;border-radius:8px;border:0;background:transparent;color:var(--chu-2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button.chon{background:var(--the);color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hang{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--vien);overflow-x:auto}
.tabs button{padding:12px 14px;min-height:46px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--chu-3);font-size:14px;white-space:nowrap}
.tabs button.chon{color:var(--navy);font-weight:700;border-bottom-color:var(--xanh-dam)}
.tabs .dem{margin-left:6px;padding:0 7px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gray-bg);color:var(--chu-2)}
.tabs .dem.do{background:var(--bad-bg);color:var(--bad-fg)}
.noi{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.o{border:1px solid var(--o);background:var(--the);border-radius:8px;padding:8px 12px;min-height:40px;font-size:14px}
.phu{color:var(--chu-4);font-size:13px}
.rong{padding:24px;text-align:center;color:var(--chu-4)}
.bang{overflow-x:auto;border:1px solid var(--vien-2);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--nhat);text-align:left;color:var(--chu-2);font-weight:600;padding:9px 8px;white-space:nowrap}
th:first-child,td:first-child{padding-left:12px}th:last-child,td:last-child{padding-right:12px}
td{padding:8px;border-top:1px solid var(--vien-2);vertical-align:top}
tr.bam{cursor:pointer}tr.bam:hover td{background:var(--row-hover)}
td a.ten{text-decoration:none;font-weight:500}
.thanh{height:5px;background:var(--seg);border-radius:3px;overflow:hidden;display:flex}
.thanh i{display:block;height:100%}
.phan-trang{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--chu-3)}

/* ---------- tổng quan ---------- */

/* ---------- sổ ---------- */
.so-bo{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.so-bo>aside{flex:1 1 280px;max-width:340px;min-width:0}
.so-bo>section{flex:999 1 600px;min-width:0}
.ds-so{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.ds-so button{border:1px solid var(--vien);background:var(--the);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ds-so button.chon{border-color:var(--xanh-dam);background:var(--brand-50);box-shadow:inset 3px 0 0 var(--xanh-dam)}
.chi-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chi-so div{background:var(--nhat);border:1px solid var(--vien-2);border-radius:10px;padding:8px 12px}
.chi-so span{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--chu-3)}
.chi-so b{font-size:20px;color:var(--navy)}
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.luoi-so button,.luoi-so span,.luoi-so a{display:block;border-radius:8px;padding:10px 0 9px;text-align:center;font-weight:600;font-size:13px;line-height:1.3;border:1px solid var(--vien);background:var(--the);cursor:pointer}
.luoi-so small{display:block;margin-top:2px;font-size:11px;font-weight:400;line-height:1.3;color:var(--chu-3);text-decoration:none}
.luoi-so .lo{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-fg);cursor:default}
.luoi-so .sai-tg{background:var(--gold-100)!important}
.luoi-so .sai-tg small{color:var(--warn-fg);font-weight:600}
.luoi-so .giu{background:var(--info-bg);color:var(--info-fg);border:1px dashed var(--info-fg)}
.luoi-dau{position:sticky;top:0;z-index:2;display:flex;flex-direction:column;gap:6px;background:var(--the);padding-bottom:8px}
.luoi-cuon{flex:1;min-height:0;overflow-y:auto;padding:2px}
.cg-luoi{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--chu-3)}
.cg-luoi span{display:inline-flex;align-items:center;gap:6px}
.cg-luoi i{flex:none;box-sizing:border-box;min-width:30px;padding:0 5px;height:22px;border-radius:5px;border:1px solid var(--vien);background:var(--the);font-size:11.5px;font-weight:600;line-height:20px;font-style:normal;text-align:center;color:var(--chu)}

/* ---------- chi tiết ---------- */
.ct-dau{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;padding:16px 18px}
.ct-dau .trai{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px}
.ct-dau h1{font-size:19px;line-height:1.35}
.tom{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:4px}
.tom div{background:var(--nhat);border:1px solid var(--mau-line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tom span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--chu-3)}
.tom b{font-size:14px;font-weight:600}
.ct-than{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.ct-trai{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:14px}
.xem-file{display:flex;flex-direction:column}
.xem-file-dau{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--vien-2)}
.xem-file-dau h2{margin:0}
.xem-file iframe{display:block;width:100%;height:82vh;min-height:520px;border:0;border-radius:0 0 12px 12px;background:var(--gray-bg)}
.ct-than>aside{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:14px}
.ct-than h2{font-size:15px;margin-bottom:8px}
dl.tt{display:grid;grid-template-columns:128px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px}
dl.tt dt{color:var(--chu-3)}dl.tt dd{margin:0;overflow-wrap:anywhere;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
dl.tt dd>span{min-width:0}
.chep{flex:none;width:26px;height:26px;padding:0;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--vien);background:var(--the);color:var(--chu-4)}
.chep:hover{border-color:var(--brand-200);color:var(--xanh)}
.chep.da{border-color:var(--brand-200);background:var(--brand-100);color:var(--xanh)}
.ct-nut{display:flex;flex:none;gap:8px;align-items:center}
.ct-nut>*{box-sizing:border-box;flex:none;width:44px;height:44px;padding:0;border-radius:10px;border:1px solid var(--vien);background:var(--the);color:var(--chu-3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ct-nut>a:hover,.ct-nut>button:hover{border-color:var(--brand-200);background:var(--brand-50)}
.ct-nut>.tat{opacity:.35;cursor:not-allowed}
.ct-nut>button.da{border-color:var(--brand-200);background:var(--brand-100);color:var(--xanh)}
.ct-nut img,.ct-nut svg{display:block;width:24px;height:24px}
.buoc-ngang{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.buoc-the{flex:1 1 0;min-width:140px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--vien);background:var(--nen-o);font-size:12.5px;color:var(--chu-2)}
.buoc-the.xong{border-color:var(--brand-200);background:var(--brand-50)}
.buoc-the.qua{border-color:var(--cam);background:var(--warn-bg)}
.buoc-the.nay{border-color:var(--xanh-dam);background:var(--brand-50)}
.buoc-the b{font-size:13.5px;font-weight:600;min-height:36px;color:var(--chu)}
.cham{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sla-hang{display:flex;align-items:center;gap:12px;font-size:13px}
.sla-hang>span:first-child{width:220px;flex:none}
.sla-thanh{flex:1;position:relative;height:14px;background:var(--gray-bg);border-radius:7px;overflow:hidden}
.sla-thanh i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.sla-thanh u{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.sla-hang>span:last-child{width:150px;flex:none;text-align:right}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--xanh-nhat);color:var(--xanh)}
.bong{font-size:13.5px;background:var(--nhat);border:1px solid var(--mau-line);border-radius:10px;padding:9px 12px}
td.lech{background:var(--bad-bg);color:var(--bad-fg);font-weight:600}

/* ---------- tạo phiếu ---------- */
.tao{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tao>section{flex:999 1 620px;min-width:0}
.tao>aside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.form label.ca{grid-column:1/-1}
.form .loi{color:var(--bad-fg);font-weight:500;font-size:12px}
.form .o{font-weight:400}
.nut-file{border:1.5px dashed var(--border-strong);border-radius:10px;padding:16px;background:var(--the);cursor:pointer;text-align:center;font-weight:400}
.nut-file.co{border:1px solid var(--brand-200);background:var(--brand-50);color:var(--ok-fg);font-weight:600}
.nut-file.sai{border-color:var(--do)}

/* ---------- điện thoại ---------- */
@media (max-width:720px){
  .form{grid-template-columns:1fr}
  .hang>.seg{width:100%;flex-wrap:nowrap;overflow-x:auto;margin-left:0!important;scrollbar-width:none}
  .hang>.seg::-webkit-scrollbar{display:none}
  .hang>.seg button{flex:1 0 auto;padding:0 12px}
  .tabs,.ck-tabs{overflow-x:auto;scrollbar-width:none}
  .noi{padding:12px}
  .the-dem{padding:12px 14px}
  .sla-hang{flex-wrap:wrap;gap:4px}.sla-hang>span:first-child{width:100%}.sla-hang>span:last-child{width:auto}
  .so-bo>aside{max-width:none}
  .an-dt{display:none}
  .tom{grid-template-columns:1fr 1fr}
  dl.tt{grid-template-columns:110px minmax(0,1fr)}
}
/* ---------- danh sách có vùng cuộn riêng, tên cột và ô tìm luôn hiện ---------- */
.sv-bang,.bang-cuon table{border-collapse:separate;border-spacing:0}
table.sv-bang thead th,.bang-cuon thead th{position:sticky;top:0;z-index:3;background:var(--nhat);box-sizing:border-box}
table.sv-bang thead tr:first-child th{height:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sv-bang .tim-o th{top:38px;height:40px;box-shadow:0 1px 0 var(--vien)}
#dsSoVb .bang,.bang-cuon{overflow:auto;max-height:calc(100dvh - 150px)}
/* Khung văn bản của sổ (ô tìm, bộ lọc, tên cột, ô tìm theo cột, phân trang) dính vào màn hình khi cuộn trang; chỉ các dòng dữ liệu cuộn bên trong khung. */
@media (min-width:901px){
  body.trang-so #noiSo.co-ds{position:sticky;top:12px;z-index:5;height:calc(100dvh - 60px);display:flex;flex-direction:column;background:var(--the)}
  body.trang-so #noiSo.co-ds .sv-dinh{position:static;box-shadow:none}
  body.trang-so #dsSoVb{flex:1;min-height:0}
  body.trang-so #dsSoVb .bang{flex:1;min-height:0;max-height:none}
  body.trang-so .phan-trang{flex:none}
  body.trang-so .so-bo>aside{max-height:calc(100dvh - 60px)}
}
@media (max-width:900px){
  .so-bo .ds-so{max-height:320px;overflow-y:auto}
}
@media (min-width:901px){
  .so-bo{flex-wrap:nowrap}
  .so-bo>aside{flex:0 0 300px;max-width:300px;position:sticky;top:12px;max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
  .so-bo .ds-so{flex:1;min-height:0;overflow-y:auto}
  .so-bo>section{flex:1 1 0}
}
/* ---------- tìm kiếm trong sổ ---------- */
/* Hàng tìm kiếm, bộ lọc và nút trạng thái luôn ở đầu màn hình khi cuộn trang */
.sv-dinh{position:sticky;top:0;z-index:8;display:flex;flex-direction:column;gap:10px;padding:8px 0 8px;background:var(--the);box-shadow:0 1px 0 var(--vien)}
.sv-thanh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.so-tai{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:0 14px 10px;font-size:12.5px}
.vt-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;max-width:min(560px,92vw);padding:11px 18px;border-radius:12px;background:var(--chu);color:var(--the);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14.5px}
.sv-o{position:relative;flex:1 1 300px;min-width:0}
.sv-o input{width:100%;padding-right:34px}
.sv-xoa{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;font-size:17px;color:var(--chu-4);cursor:pointer}
.sv-goi{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--the);border:1px solid var(--vien);border-radius:10px;box-shadow:0 10px 28px rgba(27,36,48,.16);z-index:15;max-height:340px;overflow-y:auto;padding:4px}
.sv-goi button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;padding:7px 10px;text-align:left;font-size:13.5px;cursor:pointer;border-radius:7px}
.sv-goi button:hover,.sv-goi button.on{background:var(--xanh-nhat)}
.sv-goi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-goi small{color:var(--chu-4);white-space:nowrap}
.sv-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:99px;background:var(--xanh-nhat);color:var(--xanh);font-size:12.5px;border:0;cursor:pointer}
.sv-chip span{font-size:15px;line-height:1;padding:0 4px}
.sv-goi-y{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
mark.sv{background:var(--gold-100);color:inherit;border-radius:2px;padding:0 1px}
.sv-nen{position:fixed;inset:0;z-index:40;background:rgba(27,36,48,.32)}
.sv-hop{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--the);border-radius:14px;box-shadow:0 18px 48px rgba(27,36,48,.26);display:flex;flex-direction:column}
.sv-hop.nho{width:min(480px,calc(100vw - 24px))}
.sv-dau{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--vien)}
.sv-dau h2{flex:1;font-size:16px}
.sv-than{padding:14px 16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sv-hop.nho .sv-than{display:flex;flex-direction:column;gap:4px}
.sv-chan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--vien)}
.sv-nhom{min-width:0;display:flex;flex-direction:column;gap:6px}
.sv-nhom>b{font-size:13px}
.sv-ds{max-height:176px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sv-ds label{display:flex;gap:7px;align-items:center;font-size:13px;padding:3px 2px;cursor:pointer}
.sv-ds label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-ds small{color:var(--chu-4)}
.sv-cot{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--vien-2);font-size:13.5px}
