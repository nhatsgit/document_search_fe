<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#157A5A">
<meta name="description" content="Theo dõi quy trình văn thư đến / đi trên Base: phiếu, sổ văn thư, SLA từng bước (bản demo, dữ liệu giả).">
<title>Theo dõi văn thư - CRCK</title>

<script>
/* Dùng chung lựa chọn sáng / tối với trang tra cứu (localStorage tclt_theme); áp trước khi vẽ để không nháy màu */
(function () {
  var t = 'light';
  try { t = localStorage.getItem('tclt_theme') || 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --ink:#15231C; --ink-2:#41564C; --ink-3:#6B7C74;
  --paper:#FAF8F3; --card:#FFFFFF; --line:#E2DED3; --line-2:#CFC9BA;
  --leaf:#2D6A4A; --leaf-soft:#E6EFE9; --head:#157A5A;
  --latex:#9A6B00; --latex-soft:#F6EFDD;
  --clay:#A6432A; --clay-soft:#F7E9E4;
  --sky:#2B5C7E; --sky-soft:#E5EDF3;
  --mute-soft:#EFEDE7;
  --shadow:0 1px 2px rgba(21,35,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDEA; --ink-2:#AFC0B8; --ink-3:#8A9C95;
    --paper:#111815; --card:#182220; --line:#2A3833; --line-2:#3A4B44;
    --leaf:#6FBF93; --leaf-soft:#1B2E25; --head:#0F4F3B;
    --latex:#D9AF4A; --latex-soft:#2C2616;
    --clay:#E0907B; --clay-soft:#2E1C18;
    --sky:#7FB2D6; --sky-soft:#152630;
    --mute-soft:#202B28;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDEA; --ink-2:#AFC0B8; --ink-3:#8A9C95;
  --paper:#111815; --card:#182220; --line:#2A3833; --line-2:#3A4B44;
  --leaf:#6FBF93; --leaf-soft:#1B2E25; --head:#0F4F3B;
  --latex:#D9AF4A; --latex-soft:#2C2616;
  --clay:#E0907B; --clay-soft:#2E1C18;
  --sky:#7FB2D6; --sky-soft:#152630;
  --mute-soft:#202B28;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--sky)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.so{font-variant-numeric:tabular-nums}

/* ---------- đầu trang ---------- */
.dau{background:var(--head);color:#fff;position:sticky;top:0;z-index:20}
.dau-trong{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.hieu-o{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hieu b{display:block;font-size:15px}.hieu small{display:block;font-size:11.5px;opacity:.8}
.dieu-huong{display:flex;gap:4px;margin-left:12px}
.dieu-huong a{color:#E3F1EA;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.dieu-huong a.chon{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center}
.nhan-demo{font-size:12px;background:#F6EFDD;color:#6B4B00;border-radius:99px;padding:3px 10px;font-weight:600}
.nut-tron{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.nut-tao{background:#fff;color:var(--head);border:0;border-radius:8px;padding:9px 14px;font-weight:700;text-decoration:none;white-space:nowrap}

.khung{max-width:1320px;margin:0 auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:16px}

/* ---------- thành phần chung ---------- */
.the{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.the-dem{padding:16px 18px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:8px 13px;cursor:pointer;min-height:38px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.chinh{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.chinh{color:#0E1A15}
.btn.cam{background:var(--latex-soft);border-color:var(--latex);color:var(--latex);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.vien{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tt-qua{background:var(--latex-soft);color:var(--latex)}
.tt-loi{background:var(--clay-soft);color:var(--clay)}
.tt-dung{background:var(--leaf-soft);color:var(--leaf)}
.tt-xong{background:var(--mute-soft);color:var(--ink-2)}
.tt-den{background:var(--sky-soft);color:var(--sky)}
.cham{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.c-qua{background:#E07B12}.c-loi{background:#D64545}.c-dung{background:#1F8A55}.c-xong{background:#A3ACA8}
.pill{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.pill.chon{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.seg{display:inline-flex;background:var(--mute-soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--ink-2)}
.seg button.chon{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.hang{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.chon{color:var(--ink);font-weight:700;border-bottom-color:var(--leaf)}
.o{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:8px 11px;min-height:38px}
.o:focus,.btn:focus-visible,.pill:focus-visible,.tabs button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.phu{color:var(--ink-3);font-size:12.5px}
.rong{padding:30px;text-align:center;color:var(--ink-3)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--mute-soft);padding:9px 10px;font-size:13px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.bam{cursor:pointer}tr.bam:hover td{background:var(--leaf-soft)}
.cuon-ngang{overflow-x:auto}
.phan-trang{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:10px}

/* ---------- tổng quan ---------- */
.kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi button{text-align:left;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.kpi button.chon{outline:2px solid var(--leaf)}
.kpi .nhan{font-size:12.5px;color:var(--ink-2)}.kpi .gt{font-size:26px;font-weight:700}.kpi .ghi{font-size:11.5px;color:var(--ink-3)}
.buoc-luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:16px}
.buoc-o{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px}
.buoc-o.chon{outline:2px solid var(--leaf)}
.thanh{height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden;display:flex}
.thanh i{display:block;height:100%}
.bieu-cot{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bieu-cot .cot{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bieu-cot .cot i{display:block;width:100%;max-width:44px;border-radius:4px 4px 0 0;background:var(--leaf)}
.bieu-cot .cot i.di{background:var(--sky)}

/* ---------- sổ ---------- */
.so-bo{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.ds-so{display:flex;flex-direction:column;gap:6px;padding:12px}
.ds-so button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ds-so button.chon{border-color:var(--leaf);background:var(--leaf-soft)}
.chi-so{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px 16px}
.chi-so div{background:var(--mute-soft);border-radius:10px;padding:10px 12px}
.chi-so b{display:block;font-size:20px}
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;padding:16px}
.luoi-so button,.luoi-so span{border-radius:8px;padding:8px 0;text-align:center;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.luoi-so .lo{background:var(--clay-soft);color:var(--clay);border-color:var(--clay);cursor:default}
.luoi-so .giu{background:var(--sky-soft);color:var(--sky);border-style:dashed;cursor:default}

/* ---------- chi tiết ---------- */
.ct-dau{display:flex;flex-wrap:wrap;gap:14px 24px;padding:16px 18px}
.ct-dau .trai{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px}
.ct-dau h1{font-size:19px}
.tom{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tom div{background:var(--mute-soft);border-radius:10px;padding:8px 12px}
.tom span{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.tom b{font-size:14px}
.ct-than{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.ct-ben{display:flex;flex-direction:column;gap:14px}
.ct-ben h2{font-size:15px;margin-bottom:8px}
dl.tt{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px}
dl.tt dt{color:var(--ink-2)}dl.tt dd{margin:0;overflow-wrap:anywhere}
.buoc-ngang{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.buoc-the{flex:1 1 0;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.buoc-the.xong{background:var(--leaf-soft);border-color:transparent}
.buoc-the.nay{border-color:#E07B12;background:var(--latex-soft)}
.buoc-the.nay.ok{border-color:var(--leaf);background:var(--card)}
.buoc-the b{font-size:13.5px}
.sla-hang{display:grid;grid-template-columns:200px minmax(0,1fr) 140px;gap:12px;align-items:center;font-size:13px}
.sla-thanh{position:relative;height:14px;background:var(--mute-soft);border-radius:7px;overflow:hidden}
.sla-thanh i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.sla-thanh u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.y-kien{display:flex;gap:12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--sky-soft);color:var(--sky)}
.bong{background:var(--mute-soft);border-radius:10px;padding:9px 12px;margin-top:3px}
.lech{background:var(--clay-soft);color:var(--clay);font-weight:600}

/* ---------- tạo phiếu ---------- */
.tao{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.form label.ca{grid-column:1/-1}
.form .loi{color:var(--clay);font-weight:500;font-size:12px}
.form .o{font-weight:400}
.nut-file{border:1.5px dashed var(--line-2);border-radius:10px;padding:16px;background:var(--card);cursor:pointer;text-align:center}
.nut-file.co{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf);font-weight:600}
.kiem li{margin:4px 0}

/* ---------- điện thoại ---------- */
.nav-duoi{display:none}
@media (max-width:1080px){
  .kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ct-than,.tao,.so-bo{grid-template-columns:minmax(0,1fr)}
  .chi-so{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .dieu-huong,.nut-tao,.nhan-demo{display:none}
  .dau-trong{padding:10px 16px}
  .khung{padding:14px 16px 90px}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .sla-hang{grid-template-columns:1fr;gap:4px}
  .chi-so{grid-template-columns:repeat(2,minmax(0,1fr))}
  .an-dt{display:none}
  dl.tt{grid-template-columns:110px minmax(0,1fr)}
  .tom{grid-template-columns:1fr 1fr}
  .nav-duoi{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 0 max(8px,env(safe-area-inset-bottom))}
  .nav-duoi a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;justify-content:center;text-decoration:none;color:var(--ink-3);font-size:11.5px}
  .nav-duoi a.chon{color:var(--leaf);font-weight:700}
}
@media (prefers-reduced-motion:no-preference){.the,.kpi button{transition:border-color .15s}}
</style>
</head>

'use strict';

  'Kết luận thanh tra sử dụng đất', 'Cấp kinh phí trồng tái canh năm 2027', 'Công tác bảo vệ vườn cây mùa mưa', 'Đào tạo an toàn hoá chất cho công nhân',
  'Đóng BHXH cho lao động thời vụ', 'Báo cáo môi trường định kỳ 6 tháng', 'Thanh lý vườn cây hết chu kỳ khai thác', 'Kế hoạch thi đua khen thưởng năm 2026'];
var BAY_GIO = new Date('2026-10-29T14:00:00+07:00').getTime();

      '<div class="bong" style="font-size:13px;margin-top:10px"><b>Tóm tắt AI:</b> ' + esc(p.coQuan) + ' ' + esc(p.loai[1].toLowerCase()) + ' về ' + esc(p.trich.charAt(0).toLowerCase() + p.trich.slice(1)) + ', đề nghị đơn vị triển khai và báo cáo kết quả trước ' + ngay(p.tao + 7 * 24 * GIO) + '.</div></section>' +
    '<section class="the the-dem"><h2>Tệp đính kèm</h2>' + [[tenFile + '_goc.pdf', 'file đầu vào · ' + luc(p.tao)], [tenFile + '.pdf', 'đã đổi tên theo mã · service_tep_dinh_kem']].map(function (f) {
        return '<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)"><span class="vien tt-loi" style="border-radius:4px">PDF</span><div style="min-width:0"><a href="https://drive.google.com" target="_blank" rel="noopener" style="overflow-wrap:anywhere">' + esc(f[0]) + '</a><div class="phu">' + esc(f[1]) + '</div></div></div>'; }).join('') + '</section>' +
    '<section class="the the-dem"><h2>Người liên quan</h2>' + nguoi + '</section>' +
    '<section class="the the-dem"><h2>Phiếu liên quan</h2>' + (lienQuan.length ? lienQuan.map(function (x) {
        return '<div style="padding:7px 0;border-top:1px solid var(--line)"><div class="phu">Cùng ' + (p.chieu === 'den' ? 'nơi gửi' : 'đơn vị') + ' · ' + ngay(x.tao) + '</div><a href="#/phieu/' + x.id + '">' + esc(tenPhieu(x)) + '</a><div class="phu">' + esc(tenBuoc(x)) + '</div></div>'; }).join('') : '<div class="phu">Không có</div>') + '</section>';
}

/* =====================================================================
   TẠO PHIẾU
   ===================================================================== */
var F = null;
function formMoi() { return { chieu: 'den', dv: 'CRCK2', luong: LUONG.den[0], loai: 'CV', trich: '', soGoc: '', coQuan: '', ngayVb: '', nguoiSoan: '', noiNhan: '', cheDo: 'tu', soChen: '', file: '', khan: false, daGui: false, xong: null }; }
function loiForm() {
  var l = {};
  if (!F.trich.trim()) l.trich = 'Bắt buộc';
  if (!F.file) l.file = 'Cần file PDF';
  if (F.chieu === 'den' && !F.coQuan.trim()) l.coQuan = 'Bắt buộc với văn thư đến';
  if (F.chieu === 'di' && !F.noiNhan.trim()) l.noiNhan = 'Bắt buộc với văn thư đi';
  if (F.chieu === 'di' && F.cheDo === 'chen' && !/^\d+$/.test(F.soChen.trim())) l.soChen = 'Nhập số muốn chèn';
  return l;
}
function veTao() {
  if (!F) F = formMoi();
  if (F.xong) {
    var p = F.xong;
    $('#man').innerHTML = '<section class="the the-dem" style="max-width:620px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">' +
      '<span style="width:56px;height:56px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-size:28px;display:flex;align-items:center;justify-content:center">✓</span>' +
      '<h2 style="font-size:18px">Đã tạo phiếu trên Base (demo)</h2><div>' + esc(tenPhieu(p)) + '</div>' +
      '<div class="phu">Hệ thống sẽ ' + (p.chieu === 'den' ? 'đọc file bằng AI và cấp mã văn thư đến' : 'chuyển bước 2.2 kiểm tra nội dung & thể thức') + ' trong khoảng 2 phút. Bản demo không gửi lên Base thật.</div>' +
      '<div class="hang" style="justify-content:center"><a class="btn chinh" href="#/phieu/' + p.id + '">Xem phiếu vừa tạo</a><button class="btn" id="taoTiep">Tạo phiếu khác</button></div></section>';
    return;
  }
  var l = F.daGui ? loiForm() : {}, den = F.chieu === 'den';
  var o = function (k, nhan, html, ca) { return '<label class="' + (ca ? 'ca' : '') + '">' + nhan + (l[k] ? ' <span class="loi">' + l[k] + '</span>' : '') + html + '</label>'; };
  var nhap = function (k, ph) { return '<input class="o" data-f="' + k + '" value="' + esc(F[k]) + '" placeholder="' + esc(ph || '') + '">'; };
  var chonO = function (k, ds) { return '<select class="o" data-f="' + k + '">' + ds.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (F[k] === x[0] ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</select>'; };
  var tl = loiForm();
  var maDuKien = den ? ((chiSoSo('den-' + F.dv).cuoi || 300) + 1) + '/' + F.dv + '-2026' : F.cheDo === 'chen' && F.soChen ? F.soChen + '/' + F.loai + '-' + F.dv : 'cấp khi phát hành';
  var tenXem = den ? 'VT Đến - [' + maDuKien + '] | Số ' + (F.soGoc || '…') + ' | ' + (F.trich || '…') : 'VT Đi - [' + maDuKien + '] | ' + (F.trich || '…');
  $('#man').innerHTML = '<div class="hang" style="justify-content:space-between"><h1 style="font-size:20px">Tạo phiếu văn thư trên Base</h1><span class="phu">Bản demo: bấm tạo chỉ thêm phiếu vào dữ liệu giả của trang này</span></div>' +
    '<div class="tao"><section class="the"><div class="form">' +
      '<label class="ca">Chiều văn thư<span class="seg" role="tablist">' + [['den', 'Văn thư đến'], ['di', 'Văn thư đi']].map(function (c) {
        return '<button type="button" role="tab" aria-selected="' + (F.chieu === c[0]) + '" class="' + (F.chieu === c[0] ? 'chon' : '') + '" data-fchieu="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</span></label>' +
      o('dv', 'Đơn vị', chonO('dv', DV.map(function (d) { return [d, d]; }))) +
      o('luong', 'Luồng (service Base)', chonO('luong', LUONG[F.chieu].map(function (x) { return [x, x]; }))) +
      o('loai', 'Loại văn bản', chonO('loai', LOAI)) +
      '<label style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" data-f="khan"' + (F.khan ? ' checked' : '') + '> Văn bản khẩn</label>' +
      o('trich', 'Trích yếu', '<textarea class="o" rows="2" data-f="trich" placeholder="Nội dung chính của văn bản">' + esc(F.trich) + '</textarea>', true) +
      (den ? o('soGoc', 'Số hiệu văn bản gốc <span class="phu">(để trống, AI đọc từ file)</span>', nhap('soGoc', 'vd 125/TB-TĐ')) + o('ngayVb', 'Ngày văn bản', '<input class="o" type="date" data-f="ngayVb" value="' + esc(F.ngayVb) + '">') +
          o('coQuan', 'Cơ quan ban hành', nhap('coQuan', 'vd Tập đoàn Công nghiệp Cao su VN'), true)
        : o('nguoiSoan', 'Người soạn', nhap('nguoiSoan', 'vd Phạm Thu Hà')) + o('noiNhan', 'Nơi nhận', nhap('noiNhan', 'vd UBND tỉnh; Lưu VT')) +
          o('cheDo', 'Cách cấp số', chonO('cheDo', [['tu', 'Cấp số tự động khi phát hành'], ['chen', 'Chèn số (dùng số cụ thể)'], ['giu', 'Giữ số trước']])) +
          (F.cheDo === 'chen' ? o('soChen', 'Số muốn chèn', nhap('soChen', 'vd 185')) : F.cheDo === 'giu' ? '<div class="phu" style="align-self:end">Hệ thống giữ số kế tiếp, ghi vào tab Giữ số của sổ đi.</div>' : '<div></div>')) +
      '<label class="ca">File PDF' + (l.file ? ' <span class="loi">' + l.file + '</span>' : '') + '<button type="button" class="nut-file' + (F.file ? ' co' : '') + '" id="nutFile">' + (F.file ? '📄 ' + esc(F.file) + ' — bấm để bỏ' : 'Kéo thả hoặc bấm để chọn file PDF / chụp ảnh văn bản') + '</button></label>' +
      '<div class="ca hang" style="justify-content:flex-end"><button class="btn" id="huyForm" type="button">Xoá form</button><button class="btn chinh" id="guiForm" type="button">Tạo phiếu trên Base</button></div>' +
    '</div></section>' +
    '<aside class="ct-ben"><section class="the the-dem"><h2>Xem trước tên phiếu</h2><div class="bong" style="font-weight:600">' + esc(tenXem) + '</div>' +
      '<dl class="tt" style="margin-top:10px"><dt>Luồng</dt><dd>' + esc(F.luong) + '</dd><dt>Đơn vị</dt><dd>' + F.dv + '</dd><dt>Bước đầu</dt><dd>' + esc(BUOC[F.chieu][den ? 1 : 1][0]) + '</dd></dl></section>' +
    '<section class="the the-dem"><h2>Kiểm tra trước khi gửi</h2><ul class="kiem" style="margin:0;padding-left:0;list-style:none">' +
      [['Có trích yếu', !tl.trich], ['Đã chọn file PDF', !tl.file], den ? ['Có cơ quan ban hành', !tl.coQuan] : ['Có nơi nhận', !tl.noiNhan]].concat(!den && F.cheDo === 'chen' ? [['Số chèn hợp lệ', !tl.soChen]] : [])
        .map(function (k) { return '<li><span style="color:' + (k[1] ? 'var(--leaf)' : 'var(--ink-3)') + '">' + (k[1] ? '✓' : '○') + '</span> ' + k[0] + '</li>'; }).join('') +
    '</ul></section></aside></div>';
}
function guiForm() {
  F.daGui = true;
  if (Object.keys(loiForm()).length) { veTao(); return; }
  var den = F.chieu === 'den', id = DS.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1;
  var so = den ? (chiSoSo('den-' + F.dv).cuoi || 300) + 1 : (F.cheDo === 'chen' ? Number(F.soChen) : null);
  var loai = LOAI.filter(function (x) { return x[0] === F.loai; })[0];
  var p = { id: id, chieu: F.chieu, dv: F.dv, so: den ? so : null, loai: loai, coQuan: den ? F.coQuan.trim() : F.dv, trich: F.trich.trim(), luong: F.luong,
    nguoiKy: den ? 'Chưa rõ (AI sẽ đọc)' : 'Giám đốc Lê Quốc Hùng', tao: BAY_GIO, b: 1, sla: BUOC[F.chieu][1][1], gio: 0, tt: 'dung', soTrang: 3, khan: F.khan,
    soGoc: den ? (F.soGoc.trim() || 'đang đọc…') : '', ma: den ? so + '/' + F.dv + '-2026' : 'Dự thảo #' + (900 + id) };
  DS.unshift(p);
  F.xong = p;
  veTao();
}

/* =====================================================================
   ĐIỀU HƯỚNG + SỰ KIỆN
   ===================================================================== */
function dinhTuyen() {
  var h = location.hash.replace(/^#\/?/, ''), phan = h.split('/'), nav = 'tong';
  if (phan[0] === 'so') { nav = 'so'; veSo(); document.title = 'Sổ văn thư - Theo dõi văn thư'; }
  else if (phan[0] === 'tao') { nav = 'tao'; veTao(); document.title = 'Tạo phiếu - Theo dõi văn thư'; }
  else if (phan[0] === 'phieu' && phan[1]) { nav = 'phieu'; S.tabCt = S.tabCtGiu === phan[1] ? S.tabCt : 'tien'; S.tabCtGiu = phan[1]; veChiTiet(Number(phan[1])); document.title = 'Chi tiết phiếu - Theo dõi văn thư'; }
  else if (phan[0] === 'phieu') { nav = 'phieu'; S.tab = 'ds'; veTongQuan(); document.title = 'Phiếu - Theo dõi văn thư'; }
  else { veTongQuan(); document.title = 'Theo dõi văn thư - CRCK'; }
  document.querySelectorAll('[data-nav]').forEach(function (a) { a.classList.toggle('chon', a.dataset.nav === nav || (nav === 'phieu' && a.dataset.nav === 'tong' && a.closest('.dieu-huong'))); });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', dinhTuyen);

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-dv],[data-chieu],[data-kpi],[data-tab],[data-buoc],[data-mo],[data-trang],[data-so],[data-tabso],[data-loctt],[data-trangso],[data-tabct],[data-nhac],[data-chep],[data-chaylai],[data-fchieu],#xoaLocSo,#nutFile,#guiForm,#huyForm,#taoTiep,#nutTheme');
  if (!t || t.disabled) return;
  var d = t.dataset;
  if (t.id === 'nutTheme') {
    var moi = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', moi); try { localStorage.setItem('tclt_theme', moi); } catch (x) {}
  }
  else if (d.dv) { S.dv = d.dv; S.trang = 1; veTongQuan(); }
  else if (d.chieu) { S.chieu = d.chieu; S.locBuoc = -1; S.trang = 1; veTongQuan(); }
  else if (d.kpi != null) { S.locKpi = d.kpi === S.locKpi || d.kpi === 'tat' ? '' : d.kpi; S.tab = 'ds'; S.trang = 1; veTongQuan(); }
  else if (d.tab) { S.tab = d.tab; veTongQuan(); }
  else if (d.buoc != null) { S.locBuoc = Number(d.buoc) === S.locBuoc ? -1 : Number(d.buoc); veNoiTab(); }
  else if (d.mo) { location.hash = '#/phieu/' + d.mo; }
  else if (d.trang) { S.trang = Number(d.trang); veNoiTab(); }
  else if (d.so) { S.so = d.so; S.trangSo = 1; S.locThang = S.locKy = S.locLuong = S.locTT = S.qSoVb = ''; veSo(); }
  else if (d.tabso) { S.tabSo = d.tabso; veSo(); }
  else if (d.loctt != null) { S.locTT = d.loctt; S.trangSo = 1; veNoiSo(); }
  else if (d.trangso) { S.trangSo = Number(d.trangso); veDsSoVb(); }
  else if (t.id === 'xoaLocSo') { S.locThang = S.locKy = S.locLuong = S.locTT = S.qSoVb = ''; S.trangSo = 1; veNoiSo(); }
  else if (d.tabct) { S.tabCt = d.tabct; veChiTiet(Number(S.tabCtGiu)); }
  else if (d.nhac) { S.daNhac[d.nhac] = true; veChiTiet(Number(d.nhac)); }
  else if (d.chep) { try { navigator.clipboard.writeText(d.chep); } catch (x) {} t.textContent = 'Đã sao chép ✓'; }
  else if (d.chaylai) { t.textContent = 'Đã gửi lệnh chạy lại (demo) ✓'; t.disabled = true; }
  else if (d.fchieu) { F.chieu = d.fchieu; F.luong = LUONG[F.chieu][0]; veTao(); }
  else if (t.id === 'nutFile') { F.file = F.file ? '' : 'scan_' + F.dv.toLowerCase() + '_2910.pdf'; veTao(); }
  else if (t.id === 'guiForm') { guiForm(); }
  else if (t.id === 'huyForm' || t.id === 'taoTiep') { F = formMoi(); veTao(); }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'oTim') { S.q = t.value; S.trang = 1; var giu = t.selectionStart; veNoiTab(); var o = $('#oTim'); o.focus(); o.setSelectionRange(giu, giu); }
  else if (t.id === 'oTimSo') { S.qSo = t.value; $('#dsSo').innerHTML = veDsSo(dsSo().filter(function (s) { return !S.qSo || boDau(s.ten).indexOf(boDau(S.qSo)) >= 0; })); }
  else if (t.id === 'oTimSoVb') { S.qSoVb = t.value; S.trangSo = 1; veDsSoVb(); }
  else if (t.dataset && t.dataset.f && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    F[t.dataset.f] = t.value;
    if (F.daGui || t.dataset.f === 'trich' || t.dataset.f === 'soGoc') {   // vẽ lại để cập nhật xem trước / kiểm tra, giữ con trỏ
      var k = t.dataset.f, vt = t.selectionStart; veTao(); var n = document.querySelector('[data-f="' + k + '"]'); if (n) { n.focus(); try { n.setSelectionRange(vt, vt); } catch (x) {} }
    }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'locThang') { S.locThang = t.value; S.trangSo = 1; veDsSoVb(); }
  else if (t.id === 'locKy') { S.locKy = t.value; S.trangSo = 1; veDsSoVb(); }
  else if (t.id === 'locLuong') { S.locLuong = t.value; S.trangSo = 1; veDsSoVb(); }
  else if (t.dataset && t.dataset.f) { F[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'date') veTao(); }
});

dinhTuyen();
</script>
</body>
</html>
