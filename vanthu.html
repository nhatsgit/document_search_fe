<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#145A3A">
<meta name="description" content="Theo dõi quy trình văn thư đến / đi trên Base: phiếu, sổ văn thư, đối soát Sheet ↔ Base ↔ Base Office (bản demo, dữ liệu giả).">
<title>Theo dõi văn thư</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23145A3A'/%3E%3Cpath d='M16 22h32v22H16z' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='m17 23 15 11 15-11' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bảng màu theo bản thiết kế "Theo dõi văn thư" (không dùng chung với trang tra cứu) */
:root{
  --nen:#F4F6F9; --the:#FFFFFF; --vien:#E1E6EE; --vien-2:#EDF0F5; --o:#CBD3E0;
  --chu:#1B2430; --chu-2:#374151; --chu-3:#4A5568; --chu-4:#5B6577;
  --navy:#145A3A; --navy-vien:#4E8A6C; --navy-phu:#CFE6DA;
  --xanh:#1F4FB8; --xanh-dam:#2457C5; --nut:#2E6BE6; --xanh-nhat:#E6EEFF;
  --seg:#E6EAF1; --nhat:#F7F9FC; --nen-o:#FAFBFD;
  --lua:#1F8A55; --cam:#E07B12; --do:#D64545;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--nen);color:var(--chu);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--xanh)}a:hover{color:#163A87}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.so{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--nut);outline-offset:2px}

/* ---------- đầu trang ---------- */
.dau{background:var(--navy);color:#fff}
.dau-trong{max-width:1400px;margin:0 auto;padding:12px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.dau-ten{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.dau-ten b{font-size:19px}.dau-ten small{font-size:12.5px;color:var(--navy-phu)}
.dau a.nut-vien,.dau a.nut-xanh{padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:8px;color:#fff;text-decoration:none;font-size:14px;white-space:nowrap}
.dau a.nut-vien{border:1px solid var(--navy-vien)}
.dau a.nut-vien.chon{background:rgba(255,255,255,.12);border-color:#8FBFA6;font-weight:600}
.dau a.nut-xanh{background:var(--nut);font-weight:600}
.dau a.tra-cuu{color:var(--navy-phu);font-size:13px;text-decoration:none;padding:10px 6px}
.dau a.tra-cuu:hover{color:#fff}

.khung{max-width:1400px;margin:0 auto;padding:16px 24px 48px;display:flex;flex-direction:column;gap:14px}

/* ---------- thành phần chung ---------- */
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px}
.the-dem{padding:14px 16px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.nhe{font-weight:500}
.tt-loi{background:#FDECEC;color:#9F1D1D}.tt-qua{background:#FFF1E0;color:#8A4300}.tt-lech{background:#EEF2FF;color:#3730A3}
.tt-giu{background:#EEE9FB;color:#5B3BA8}.tt-dung{background:#E8F5EE;color:#1F6B44}.tt-xong{background:#F1F3F6;color:var(--chu-3)}
.c-den{background:var(--xanh-nhat);color:var(--xanh)}.c-di{background:#FFF1E0;color:#8A4300}.c-giu{background:#EEF2FF;color:#3730A3}
.nut{padding:8px 14px;min-height:38px;border-radius:8px;border:1px solid var(--o);background:#fff;color:var(--chu);cursor:pointer;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nut:hover{border-color:#9AA6BA}
.nut.chon{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:600}
.nut.tron{padding:6px 12px;min-height:34px;border-radius:99px;font-size:13px}
.nut.chinh{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.nut.xanh{background:var(--nut);border-color:var(--nut);color:#fff;font-weight:600}
.nut.cam{border-color:var(--cam);background:#FFF8EF;color:#8A4300;font-weight:600}
.nut.loc{border-color:var(--xanh);background:var(--xanh-nhat);color:var(--xanh)}
.nut:disabled{opacity:.55;cursor:not-allowed}
.seg{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:10px}
.seg button{padding:8px 14px;min-height:36px;border-radius:8px;border:0;background:transparent;color:var(--chu-2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button.chon{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hang{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--vien);overflow-x:auto}
.tabs button{padding:12px 14px;min-height:46px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--chu-3);font-size:14px;white-space:nowrap}
.tabs button.chon{color:var(--navy);font-weight:700;border-bottom-color:var(--xanh-dam)}
.tabs .dem{margin-left:6px;padding:0 7px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF1F6;color:var(--chu-2)}
.tabs .dem.do{background:#FDECEC;color:#9F1D1D}
.noi{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.o{border:1px solid var(--o);background:#fff;border-radius:8px;padding:8px 12px;min-height:40px;font-size:14px}
.phu{color:var(--chu-4);font-size:13px}
.rong{padding:24px;text-align:center;color:var(--chu-4)}
.bang{overflow-x:auto;border:1px solid var(--vien-2);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--nhat);text-align:left;color:var(--chu-2);font-weight:600;padding:9px 8px;white-space:nowrap}
th:first-child,td:first-child{padding-left:12px}th:last-child,td:last-child{padding-right:12px}
td{padding:8px;border-top:1px solid var(--vien-2);vertical-align:top}
tr.bam{cursor:pointer}tr.bam:hover td{background:#F5F8FD}
td a.ten{text-decoration:none;font-weight:500}
.thanh{height:5px;background:var(--seg);border-radius:3px;overflow:hidden;display:flex}
.thanh i{display:block;height:100%}
.phan-trang{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--chu-3)}

/* ---------- tổng quan ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi button{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;cursor:pointer}
.kpi button:hover{border-color:#B9C3D3}
.kpi .nhan{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--chu-3)}
.kpi .gt{font-size:26px;font-weight:700;color:var(--navy)}
.kpi .ghi{font-size:12px;color:var(--chu-4)}
.canh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:9px 12px;border:1px solid var(--vien-2);border-radius:10px;cursor:pointer}
.canh:hover{border-color:#C9D3E6;background:#FAFCFF}
.canh .giua{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.canh .giua b{font-weight:600;font-size:14px;color:var(--xanh)}
.ong{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ong button{border:1px solid var(--vien);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--nen-o);cursor:pointer;text-align:left}
.ong button:hover{border-color:#9AA6BA}
.ong .tb{font-size:12.5px;color:var(--chu-2);min-height:32px}
.day-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.day-so>div{border:1px solid var(--vien-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cot-thang{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px}
.cot-thang>div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cot-thang .cap{display:flex;gap:3px;align-items:flex-end;height:130px}
.cot-thang i{display:block;width:16px;border-radius:3px 3px 0 0}
.ghi-mau{display:flex;gap:14px;font-size:12.5px;color:var(--chu-2)}
.ghi-mau span{display:flex;align-items:center;gap:6px}
.ghi-mau i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- sổ ---------- */
.so-bo{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.so-bo>aside{flex:1 1 280px;max-width:340px;min-width:0}
.so-bo>section{flex:999 1 600px;min-width:0}
.ds-so{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.ds-so button{border:1px solid var(--vien);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ds-so button.chon{border-color:var(--xanh-dam);background:#F2F6FF;box-shadow:inset 3px 0 0 var(--xanh-dam)}
.chi-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chi-so div{background:var(--nhat);border:1px solid var(--vien-2);border-radius:10px;padding:8px 12px}
.chi-so span{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--chu-3)}
.chi-so b{font-size:20px;color:var(--navy)}
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.luoi-so button,.luoi-so span,.luoi-so a{display:block;border-radius:8px;padding:8px 0;text-align:center;font-weight:600;font-size:13px;border:1px solid var(--vien);background:#fff;cursor:pointer}
.luoi-so .lo{background:#FDECEC;color:#9F1D1D;border-color:#F0B4B4;cursor:default}
.luoi-so .giu{background:#EEF2FF;color:#3730A3;border:1px dashed #A5B0F0}
.cg-luoi{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--chu-3)}
.cg-luoi span{display:inline-flex;align-items:center;gap:6px}
.cg-luoi i{flex:none;box-sizing:border-box;min-width:30px;padding:0 5px;height:22px;border-radius:5px;border:1px solid var(--vien);background:#fff;font-size:11.5px;font-weight:600;line-height:20px;font-style:normal;text-align:center;color:var(--chu)}

/* ---------- chi tiết ---------- */
.ct-dau{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;padding:16px 18px}
.ct-dau .trai{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px}
.ct-dau h1{font-size:19px;line-height:1.35}
.tom{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:4px}
.tom div{background:var(--nhat);border:1px solid #E8ECF2;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tom span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--chu-3)}
.tom b{font-size:14px;font-weight:600}
.ct-than{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.ct-than>section{flex:999 1 640px;min-width:0}
.ct-than>aside{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:14px}
.ct-than h2{font-size:15px;margin-bottom:8px}
dl.tt{display:grid;grid-template-columns:128px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px}
dl.tt dt{color:var(--chu-3)}dl.tt dd{margin:0;overflow-wrap:anywhere}
.buoc-ngang{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.buoc-the{flex:1 1 0;min-width:140px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--vien);background:var(--nen-o);font-size:12.5px;color:var(--chu-2)}
.buoc-the.xong{border-color:#CDE7D8;background:#F5FBF7}
.buoc-the.qua{border-color:var(--cam);background:#FFF8EF}
.buoc-the.nay{border-color:var(--xanh-dam);background:#F2F6FF}
.buoc-the b{font-size:13.5px;font-weight:600;min-height:36px;color:var(--chu)}
.cham{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sla-hang{display:flex;align-items:center;gap:12px;font-size:13px}
.sla-hang>span:first-child{width:220px;flex:none}
.sla-thanh{flex:1;position:relative;height:14px;background:#EEF1F6;border-radius:7px;overflow:hidden}
.sla-thanh i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.sla-thanh u{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.sla-hang>span:last-child{width:150px;flex:none;text-align:right}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--xanh-nhat);color:var(--xanh)}
.bong{font-size:13.5px;background:var(--nhat);border:1px solid #E8ECF2;border-radius:10px;padding:9px 12px}
td.lech{background:#FDECEC;color:#9F1D1D;font-weight:600}

/* ---------- tạo phiếu ---------- */
.tao{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tao>section{flex:999 1 620px;min-width:0}
.tao>aside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.form label.ca{grid-column:1/-1}
.form .loi{color:#9F1D1D;font-weight:500;font-size:12px}
.form .o{font-weight:400}
.nut-file{border:1.5px dashed #AEB8C8;border-radius:10px;padding:16px;background:#fff;cursor:pointer;text-align:center;font-weight:400}
.nut-file.co{border:1px solid #CDE7D8;background:#F5FBF7;color:#1F6B44;font-weight:600}
.nut-file.sai{border-color:var(--do)}

/* ---------- điện thoại ---------- */
.nav-duoi{display:none}
@media (max-width:720px){
  .dau-trong{padding:12px 16px}
  .dau a.nut-vien,.dau a.nut-xanh,.dau a.tra-cuu{display:none}
  .khung{padding:14px 16px 96px}
  .kpi{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .sla-hang{flex-wrap:wrap;gap:4px}.sla-hang>span:first-child{width:100%}.sla-hang>span:last-child{width:auto}
  .so-bo>aside{max-width:none}
  .an-dt{display:none}
  .tom{grid-template-columns:1fr 1fr}
  dl.tt{grid-template-columns:110px minmax(0,1fr)}
  .nav-duoi{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--vien);padding:4px 0 max(8px,env(safe-area-inset-bottom))}
  .nav-duoi a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;text-decoration:none;color:var(--chu-4);font-size:11.5px}
  .nav-duoi a.chon{color:var(--xanh-dam);font-weight:700}
}
/* ---------- tìm kiếm trong sổ ---------- */
.sv-thanh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sv-o{position:relative;flex:1 1 300px;min-width:0}
.sv-o input{width:100%;padding-right:34px}
.sv-xoa{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;font-size:17px;color:var(--chu-4);cursor:pointer}
.sv-goi{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--the);border:1px solid var(--vien);border-radius:10px;box-shadow:0 10px 28px rgba(27,36,48,.16);z-index:15;max-height:340px;overflow-y:auto;padding:4px}
.sv-goi button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;padding:7px 10px;text-align:left;font-size:13.5px;cursor:pointer;border-radius:7px}
.sv-goi button:hover,.sv-goi button.on{background:var(--xanh-nhat)}
.sv-goi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-goi small{color:var(--chu-4);white-space:nowrap}
.sv-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:99px;background:var(--xanh-nhat);color:var(--xanh);font-size:12.5px;border:0;cursor:pointer}
.sv-chip span{font-size:15px;line-height:1;padding:0 4px}
.sv-goi-y{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
mark.sv{background:#FFF0B8;color:inherit;border-radius:2px;padding:0 1px}
.sv-nen{position:fixed;inset:0;z-index:40;background:rgba(27,36,48,.32)}
.sv-hop{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--the);border-radius:14px;box-shadow:0 18px 48px rgba(27,36,48,.26);display:flex;flex-direction:column}
.sv-hop.nho{width:min(480px,calc(100vw - 24px))}
.sv-dau{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--vien)}
.sv-dau h2{flex:1;font-size:16px}
.sv-than{padding:14px 16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sv-hop.nho .sv-than{display:flex;flex-direction:column;gap:4px}
.sv-chan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--vien)}
.sv-nhom{min-width:0;display:flex;flex-direction:column;gap:6px}
.sv-nhom>b{font-size:13px}
.sv-ds{max-height:176px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sv-ds label{display:flex;gap:7px;align-items:center;font-size:13px;padding:3px 2px;cursor:pointer}
.sv-ds label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-ds small{color:var(--chu-4)}
.sv-cot{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--vien-2);font-size:13.5px}
.sv-cot label{flex:1;display:flex;gap:7px;align-items:center;min-width:0}
.sv-cot input[type=range]{width:96px}
.sv-mt{width:30px;height:30px;border:1px solid var(--o);background:var(--the);border-radius:7px;cursor:pointer}
.sv-mt:disabled{opacity:.35;cursor:default}
table.sv-bang{table-layout:fixed}
table.sv-bang th.sap{cursor:pointer;user-select:none}
table.sv-bang td{overflow-wrap:anywhere}
/* ---------- 2 nút mở phiếu Service và Office ---------- */
.hd-lk{display:inline-flex;gap:4px;align-items:center;flex:none}
.hd-lk a,.hd-lk span{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.hd-lk a:hover{background:var(--seg)}
.hd-lk img{width:24px;height:24px;display:block}
.hd-lk span img{filter:grayscale(1);opacity:.28}
/* ---------- quy trình văn thư (trang chủ) ---------- */
.qt{overflow:hidden}
.qt-dau{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.qt-dau:hover{background:var(--nhat)}
.qt-ten{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qt-ten b{font-size:15px}.qt-ten span{font-size:12.5px;color:var(--chu-4)}
.qt-bao{flex:none;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--do);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.qt-mui{flex:none;width:10px;height:10px;border-right:2px solid var(--chu-4);border-bottom:2px solid var(--chu-4);transform:rotate(-135deg) translate(-2px,-2px);margin:0 4px}
.qt-dau[aria-expanded="false"] .qt-mui{transform:rotate(45deg) translate(-2px,-2px)}
.qt-than{padding:12px 16px 16px;border-top:1px solid var(--vien-2);display:flex;flex-direction:column;gap:12px}
.qt-chu{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--chu-3)}
.qt-chu span{display:inline-flex;align-items:center;gap:6px}
.qt-cham{flex:none;width:9px;height:9px;border-radius:50%}
.qt-thoi{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:10px 10px 4px 2px;margin-top:-6px}
.qt-mt{flex:none;align-self:center;color:var(--chu-4);font-size:16px}
.qt-buoc{position:relative;flex:1 0 165px;min-width:165px;display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--vien);border-radius:10px;background:var(--nen-o);text-align:left;font-size:12.5px;color:var(--chu-4)}
.qt-buoc.duyet{border-style:dashed;border-color:var(--o)}
.qt-buoc.ket{cursor:pointer;background:#E8F5EE;border:1px solid var(--navy-vien);color:var(--chu-2)}
.qt-buoc.ket:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(20,90,58,.14)}
.qt-tb{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;font-weight:600;color:var(--chu-3);padding-right:14px}
.qt-buoc.ket .qt-tb{color:var(--chu)}
.qt-tb .qt-cham{margin-top:5px}
.qt-buoc .qt-bao{position:absolute;top:-9px;right:-7px;box-shadow:0 0 0 2px #fff}
.qt-kq{margin-top:auto;padding-top:2px}
.qt-buoc.ket .qt-kq{font-weight:500}
.ngan-nen{position:fixed;inset:0;z-index:40;background:rgba(27,36,48,.28)}
.ngan{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(460px,100%);background:var(--the);box-shadow:-6px 0 24px rgba(27,36,48,.18);display:flex;flex-direction:column}
.ngan-dau{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--vien)}
.ngan-dau>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ngan-dau h2{font-size:16px}.ngan-dau span{font-size:13px;color:var(--chu-4)}
.ngan-dong{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--o);background:#fff;font-size:18px;line-height:1;cursor:pointer}
.ngan-ds{flex:1;overflow-y:auto;padding:0 18px}
.ngan-muc{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--vien-2)}
.ngan-muc>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ngan-muc b{font-size:14px;font-weight:600}
.ngan-muc small{font-size:12.5px;color:var(--chu-3)}
@media (max-width:720px){
  .qt-thoi{flex-direction:column;overflow:visible;padding:8px 8px 0 0}
  .qt-buoc{flex:none;width:100%}
  .qt-mt{transform:rotate(90deg);line-height:1}
}

<script>
'use strict';
/* =====================================================================
   DỮ LIỆU: đọc từ API /api/vanthu (sheet HE THONG BASE), chỉ đọc.
   ===================================================================== */
var API_VT = 'https://document-search-api-319700450833.us-central1.run.app/api/vanthu';
var DV = ['BHCK', 'CRCK', 'CRCK2', 'BHVN', 'Đảng ủy'];
var BUOC = { den: [], di: [] };   // [tên bước, số giờ coi là treo] — lấy từ API
var NGUOI = {
  den: ['Hệ thống · AI', 'Văn thư · lãnh đạo', 'Văn thư · lãnh đạo', 'Hệ thống'],
  di: ['Hệ thống · AI', 'Người soạn · văn thư', 'Lãnh đạo', 'Văn thư', 'Trưởng phòng TCHC', 'Văn thư · hệ thống'],
};
// Vai trò hiển thị ở khung quy trình; mỗi bước: [mã vai trò, việc của bước]
var VAI_TRO = { ht: ['Hệ thống · AI', '#7A8794'], vt: ['Văn thư · chuyên viên', '#2E6BE6'], tp: ['Trưởng phòng', '#B7791F'], gd: ['Lãnh đạo', '#145A3A'] };
var QT = {
  den: { ten: 'Quy trình văn thư đến', mo: 'AI đọc văn bản → xử lý → chuyển file chính thức → lưu Base Office',
    buoc: [['ht', 'Đọc file đến, cấp mã văn thư'], ['vt', 'Đồng bộ thông tin trên phiếu'], ['vt', 'Đổi tên, chuyển file chính thức'], ['ht', 'Lưu văn bản vào Base Office']], duyet: [] },
  di: { ten: 'Quy trình văn thư đi', mo: 'AI đọc dự thảo → nội dung, thể thức → xin ý kiến → cấp số → soát xét → ban hành',
    buoc: [['ht', 'Đọc dự thảo, tạo phiếu'], ['vt', 'Soát nội dung và thể thức'], ['gd', 'Xin ý kiến'], ['vt', 'Cấp số theo sổ'], ['tp', 'Soát xét; trùng số sẽ bị khoá'], ['vt', 'Ban hành, đẩy Base Office']], duyet: [2, 4] },
};
var BAY_GIO = Date.now();
var GIO = 3600000;
var DS = [], GIU_SO = [], DS_SO = [], NHAT_KY = [];

var layNam = function (t) { return new Date(t + 7 * GIO).getUTCFullYear(); };
function apDuLieu(d) {
  BAY_GIO = d.luc;
  ['den', 'di'].forEach(function (c) { BUOC[c] = d.buoc[c].map(function (t) { return [t, d.treoGio]; }); });
  var daCo = {};
  DS = d.phieu.map(function (x, i) {
    var id = x.root && !daCo[x.root] ? x.root : 'd' + i; daCo[id] = 1;
    return Object.assign({}, x, { id: id, loai: [x.loai, x.loai], b: x.buoc == null ? 0 : x.buoc, sla: d.treoGio, tao: x.ngay || x.lucCuoi || d.luc,
      khan: false, base: true, office: x.linkOffice ? 'Có' : x.tt === 'lech' ? 'Chưa' : '—' });
  });
  GIU_SO = DS.filter(function (p) { return p.giu && p.so != null; }).map(function (p) { return { dv: p.dv, soId: p.soId, so: p.khoa, ly: p.trich, nguoi: p.nguoiSoan || p.donVi || p.dv, nam: layNam(p.tao), id: p.id }; });
  var nhom = {};
  DS.forEach(function (p) {
    var n = nhom[p.soId] = nhom[p.soId] || { id: p.soId, chieu: p.chieu, dv: p.dv, n: 0, loai: {}, dvs: {}, luong: p.luong };
    n.n++; if (p.loai[1]) n.loai[p.loai[1]] = (n.loai[p.loai[1]] || 0) + 1; if (p.donVi) n.dvs[p.donVi] = 1;
  });
  DS_SO = Object.keys(nhom).map(function (k) {
    var n = nhom[k], ls = Object.keys(n.loai).sort(function (a, b) { return n.loai[b] - n.loai[a]; }), dv = Object.keys(n.dvs);
    n.ky = ls.join(', ');
    n.ten = n.chieu === 'den' ? 'Sổ ' + (n.luong || 'Văn thư đến') : 'Sổ ' + (ls.slice(0, 3).join(', ') || 'chưa rõ loại') + (ls.length > 3 ? ' +' + (ls.length - 3) : '');
    n.donViSo = dv.length === 1 && dv[0] !== n.dv ? dv[0] : dv.length > 1 ? dv.length + ' đơn vị soạn' : '';
    return n;
  }).sort(function (a, b) { return (a.chieu === 'den' ? 0 : 1) - (b.chieu === 'den' ? 0 : 1) || b.n - a.n; });
  NHAT_KY = d.nhatKy;
  S.nam = layNam(d.luc);
  datLaiLocSo();
  chonSoDau();
  var dt = new Date(d.luc), hai = function (n) { return ('0' + n).slice(-2); };
  $('#capNhat').textContent = 'Google Sheet HE THONG BASE · ' + DS.length + ' dòng sổ · cập nhật ' + hai(dt.getHours()) + ':' + hai(dt.getMinutes()) + ' ' + hai(dt.getDate()) + '/' + hai(dt.getMonth() + 1) + '/' + dt.getFullYear();
}
function chonSoDau() { var x = DS_SO.filter(function (s) { return s.dv === S.dvSo; })[0]; S.so = x ? x.id : ''; }
function napDuLieu() {
  $('#man').innerHTML = '<div class="the rong">Đang đọc sổ văn thư…</div>';
  fetch(API_VT).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.loi || 'API lỗi');
    apDuLieu(j.data); dinhTuyen();
  }).catch(function (e) {
    $('#capNhat').textContent = 'Không đọc được sổ văn thư';
    $('#man').innerHTML = '<div class="the rong">Không đọc được sổ văn thư: ' + esc(e.message) + ' <button class="nut" id="thuLai">Thử lại</button></div>';
  });
}

/* ---------- tiện ích ---------- */
var $ = function (s, g) { return (g || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function boDau(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function gioChu(g) { if (g < 1) return Math.round(g * 60) + ' phút'; var h = Math.floor(g), m = Math.round((g - h) * 60); return h + ' giờ' + (m ? ' ' + m + ' phút' : ''); }
function gioNgan(g) { return String(Math.round(g * 10) / 10).replace('.', ','); }
function ngay(t) { var d = new Date(t); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
function luc(t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' ' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
var TT = { loi: 'Lỗi', qua: 'Treo lâu', lech: 'Lệch dữ liệu', dung: 'Đúng hạn', giu: 'Giữ số', xong: 'Hoàn tất' };
var THU_TU_TT = { loi: 0, qua: 1, lech: 2, dung: 3, giu: 4, xong: 5 };
function chipTT(tt) { return '<span class="chip tt-' + tt + '">' + TT[tt] + '</span>'; }
function chipChieu(c, dai) { return '<span class="chip ' + (c === 'den' ? 'c-den">' + (dai ? 'Văn thư đến' : 'Đến') : 'c-di">' + (dai ? 'Văn thư đi' : 'Đi')) + '</span>'; }
function tenBuoc(p) { return p.huy ? 'Đã huỷ' : !p.root ? 'Sổ cũ ghi tay' : p.tt === 'xong' ? 'Hoàn tất' : p.tt === 'giu' ? 'Giữ số, chờ hồ sơ' : BUOC[p.chieu][p.b][0]; }
function nguoiGiu(p) { return p.tt === 'xong' ? '—' : NGUOI[p.chieu][p.b]; }
function nutLienKet(p) {
  var mot = function (u, anh, ten) {
    return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" title="Xem phiếu ' + ten + '" aria-label="Xem phiếu ' + ten + '"><img src="img/' + anh + '" alt=""></a>'
      : '<span title="' + (p.root ? 'Chưa có phiếu ' + ten : 'Sổ cũ ghi tay, không có phiếu ' + ten) + '"><img src="img/' + anh + '" alt=""></span>';
  };
  return '<span class="hd-lk">' + mot(p.linkBase, 'base-service.png', 'Service') + mot(p.linkOffice, 'base-office.png', 'Office') + '</span>';
}
function chipPhieu(p) { return p.huy ? '<span class="chip tt-xong" style="text-decoration:line-through">Đã huỷ</span>' : p.root ? chipTT(p.tt) : '<span class="chip tt-xong" title="Ghi tay trước khi dùng hệ thống Base">Sổ cũ</span>'; }
function maHien(p) { return p.ma || 'Chưa cấp'; }
function tenPhieu(p) { return p.ten || ((p.chieu === 'den' ? 'VT Đến - ' : 'VT Đi - ') + (p.ma ? '[' + p.ma + '] ' : '') + p.trich); }
function moTa(p) {
  if (p.lyDo) return p.lyDo;
  return p.tt === 'xong' ? tenBuoc(p) : 'Đang ở ' + tenBuoc(p);
}
function timPhieu(id) { return DS.filter(function (p) { return p.id === id; })[0]; }
function khop(p, q) { return !q || boDau([p.ma, p.soGoc, p.trich, p.coQuan, p.nguoiKy, tenBuoc(p), nguoiGiu(p), p.dv].join(' ')).indexOf(boDau(q)) >= 0; }
function tick(ok, coDuLieu) { return 'chip nhe ' + (!coDuLieu ? 'tt-xong' : ok ? 'tt-dung' : 'tt-loi'); }

/* ---------- trạng thái giao diện ---------- */
var S = { dv: 'Tất cả', chieu: 'tat', tab: 'can', locCanh: 'tat', locPhieu: 'tat', locBuoc: null, q: '', trang: 1,
  so: 'den|BHCK', dvSo: 'BHCK', qSo: '', tabSo: 'vb', locThang: '', locKy: '', locLuong: '', locTT: '', qSoVb: '', trangSo: 1, tabCt: 'tien', ctId: null, thuQt: {}, ngan: null };

function dsChon() { return DS.filter(function (p) { return (S.dv === 'Tất cả' || p.dv === S.dv) && (S.chieu === 'tat' || p.chieu === S.chieu); }); }
function dsMo() { return dsChon().filter(function (p) { return p.tt !== 'xong' && p.tt !== 'giu'; }); }

/* =====================================================================
   TỔNG QUAN
   ===================================================================== */
function phieuKet(c, i) {   // phiếu đang kẹt ở một bước: lỗi, treo lâu hoặc lệch dữ liệu
  return dsMo().filter(function (p) { return p.chieu === c && p.b === i && p.tt !== 'dung'; })
    .sort(function (a, b) { return THU_TU_TT[a.tt] - THU_TU_TT[b.tt] || b.gio / b.sla - a.gio / a.sla; });
}
function tomTatKet(ds) {
  return [['loi', 'lỗi'], ['qua', 'treo lâu'], ['lech', 'lệch']].map(function (t) {
    var n = ds.filter(function (p) { return p.tt === t[0]; }).length; return n ? n + ' ' + t[1] : ''; }).filter(Boolean).join(' · ');
}
function veQuyTrinh() {
  return (S.chieu === 'tat' ? ['den', 'di'] : [S.chieu]).map(function (c) {
    var q = QT[c], thu = !!S.thuQt[c], dsKet = BUOC[c].map(function (b, i) { return phieuKet(c, i); });
    var tong = dsKet.reduce(function (n, x) { return n + x.length; }, 0);
    var vai = q.buoc.map(function (b) { return b[0]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    return '<section class="the qt"><button class="qt-dau" data-qtthu="' + c + '" aria-expanded="' + !thu + '"><span class="qt-ten"><b>' + q.ten + '</b><span>' + q.mo + '</span></span>' +
        (tong ? '<span class="qt-bao so" aria-label="' + tong + ' phiếu đang kẹt">' + tong + '</span>' : '') + '<span class="qt-mui" aria-hidden="true"></span></button>' +
      (thu ? '' : '<div class="qt-than"><div class="qt-chu">' + vai.map(function (v) { return '<span><i class="qt-cham" style="background:' + VAI_TRO[v][1] + '"></i>' + VAI_TRO[v][0] + '</span>'; }).join('') + '<span>◇ Bước duyệt</span></div>' +
        '<div class="qt-thoi">' + BUOC[c].map(function (b, i) {
          var x = dsKet[i], n = x.length, v = VAI_TRO[q.buoc[i][0]], laDuyet = q.duyet.indexOf(i) >= 0;
          var trongHan = dsMo().filter(function (p) { return p.chieu === c && p.b === i && p.tt === 'dung'; }).length;
          var than = '<span class="qt-tb"><i class="qt-cham" style="background:' + v[1] + '"></i><span>' + (laDuyet ? '◇ ' : '') + esc(b[0]) + '</span></span>' +
            '<span>' + esc(NGUOI[c][i]) + '</span><span>' + esc(q.buoc[i][1]) + '</span>' +
            '<span class="qt-kq">' + (n ? n + ' phiếu kẹt: ' + tomTatKet(x) : trongHan ? trongHan + ' phiếu trong hạn' : 'Không có phiếu') + '</span>';
          return (i ? '<span class="qt-mt" aria-hidden="true">→</span>' : '') + (n
            ? '<button class="qt-buoc ket' + (laDuyet ? ' duyet' : '') + '" data-qtmo="' + c + ':' + i + '" aria-label="' + esc(b[0]) + ': ' + n + ' phiếu đang kẹt, bấm để xem">' + than + '<span class="qt-bao so">' + n + '</span></button>'
            : '<div class="qt-buoc' + (laDuyet ? ' duyet' : '') + '">' + than + '</div>');
        }).join('') + '</div></div>') + '</section>';
  }).join('');
}
function veNgan() {
  var g = $('#nganKet');
  if (!g) { g = document.createElement('div'); g.id = 'nganKet'; document.body.appendChild(g); }
  var mo = !!S.ngan, ds = mo ? phieuKet(S.ngan[0], S.ngan[1]) : [];
  Array.prototype.forEach.call(document.body.children, function (x) { if (x !== g) x.inert = mo; });
  document.body.style.overflow = mo ? 'hidden' : '';
  if (!mo) { g.innerHTML = ''; return; }
  var c = S.ngan[0], i = S.ngan[1];
  g.innerHTML = '<div class="ngan-nen" data-dongngan="1"></div><aside class="ngan" role="dialog" aria-modal="true" aria-labelledby="nganTen"><div class="ngan-dau"><div><h2 id="nganTen">' + esc(BUOC[c][i][0]) + '</h2>' +
      '<span>' + esc(NGUOI[c][i]) + ' · ' + ds.length + ' phiếu đang kẹt' + (S.dv === 'Tất cả' ? '' : ' · ' + esc(S.dv)) + '</span></div><button class="ngan-dong" id="nganDong" data-dongngan="1" aria-label="Đóng">×</button></div>' +
    '<div class="ngan-ds">' + (ds.length ? ds.map(function (p) {
      return '<div class="ngan-muc"><div>' + chipTT(p.tt) + '<b>' + esc(p.trich) + '</b><small>' + esc(maHien(p)) + ' · ' + esc(p.dv) + '</small><small>' + esc(moTa(p)) + '</small></div>' +
        nutLienKet(p) + '<a class="nut" href="#/phieu/' + esc(p.id) + '">Xem</a></div>';
    }).join('') : '<div style="padding:18px 0;color:#1F6B44">Bước này không còn phiếu kẹt.</div>') + '</div></aside>';
  $('#nganDong').focus();
}

function veTongQuan() {
  var mo = dsMo(), dem = function (tt) { return mo.filter(function (p) { return p.tt === tt; }).length; };
  var can = mo.filter(function (p) { return p.tt !== 'dung'; }).length;
  var thangNay = new Date(BAY_GIO).getMonth();
  var banHanh = DS.filter(function (p) { return p.office === 'Có' && p.chieu === 'di' && (S.dv === 'Tất cả' || p.dv === S.dv) && new Date(p.tao).getMonth() === thangNay && layNam(p.tao) === layNam(BAY_GIO); }).length;
  var giu = GIU_SO.filter(function (g) { return (S.dv === 'Tất cả' || g.dv === S.dv) && g.nam === S.nam; }).length;
  var kpi = [
    ['Đang xử lý', mo.length, mo.filter(function (p) { return p.chieu === 'den'; }).length + ' đến · ' + mo.filter(function (p) { return p.chieu === 'di'; }).length + ' đi', '', 'phieu:tat'],
    ['Treo lâu', dem('qua'), 'không có bước mới > 3 ngày', '#8A4300', 'can:qua'],
    ['Lỗi hệ thống', dem('loi'), 'AI, file, trùng số', '#9F1D1D', 'can:loi'],
    ['Lệch dữ liệu', dem('lech'), 'tới bước cuối, chưa có Office', '#3730A3', 'can:lech'],

      return '<tr><td style="font-weight:500">' + h[0] + '</td><td>' + esc(h[1]) + '</td><td>' + (h[2] ? '<a href="' + esc(h[2]) + '" target="_blank" rel="noopener">Mở</a>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  var ev = suKien(p);
  return ev.length ? '<div style="display:flex;flex-direction:column">' + ev.map(dongNk).join('') + '</div>' : '<div class="rong">Dòng này không có nhật ký xử lý</div>';
}
function benChiTiet(p) {
  var tt = [['Loại văn thư', p.loai[1]], [p.chieu === 'den' ? 'Mã văn thư đến' : 'Số ký hiệu', maHien(p)], p.chieu === 'den' ? ['Số gốc', p.soGoc] : null,
    ['Ngày văn bản', p.ngayVb ? ngay(p.ngayVb) : ''], [p.chieu === 'den' ? 'Ngày nhận' : 'Ngày ban hành', p.ngay ? ngay(p.ngay) : ''], [p.chieu === 'den' ? 'Đơn vị ban hành' : 'Đơn vị soạn', p.coQuan],
    ['Người soạn', p.nguoiSoan], ['Người ký', p.nguoiKy], ['Trích yếu', p.trich], ['Nhận, thực hiện', p.donViNhan], ['Chủ trì', p.chuTri], ['Phân loại', p.phanLoai], ['Thời hạn bảo quản', p.thoiHan], ['Số trang', p.soTrang]]
    .filter(function (x) { return x && x[1] !== '' && x[1] != null; });
  return '<section class="the the-dem" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">Thông tin văn bản</h2><dl class="tt">' + tt.map(function (x) { return '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>' +
    (p.tomTat ? '<div class="bong" style="font-size:12.5px;color:var(--chu-2);white-space:pre-line;overflow-wrap:anywhere"><b>Tóm tắt</b>\n' + esc(p.tomTat) + '</div>' : '') + '</section>';
}
/* =====================================================================
   ĐIỀU HƯỚNG + SỰ KIỆN
   ===================================================================== */
function dinhTuyen() {
  if (!DS.length) return;
  if (S.ngan) { S.ngan = null; veNgan(); }
  var phan = location.hash.replace(/^#\/?/, '').split('/'), nav = 'tong';
  if (phan[0] === 'so') { nav = 'so'; veSo(); document.title = 'Sổ văn thư · Theo dõi văn thư'; }
  else if (phan[0] === 'phieu' && phan[1]) { nav = 'phieu'; veChiTiet(decodeURIComponent(phan[1])); document.title = 'Chi tiết phiếu · Theo dõi văn thư'; }
  else if (phan[0] === 'phieu') { nav = 'phieu'; S.tab = 'phieu'; veTongQuan(); document.title = 'Phiếu · Theo dõi văn thư'; }
  else { veTongQuan(); document.title = 'Theo dõi văn thư'; }
  document.querySelectorAll('[data-nav]').forEach(function (a) { a.classList.toggle('chon', a.dataset.nav === nav); });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', dinhTuyen);

document.addEventListener('click', function (e) {
  var t = e.target.closest('a[href^="#/phieu/"],[data-qtthu],[data-qtmo],[data-dongngan],[data-dv],[data-chieu],[data-kpi],[data-tab],[data-loccanh],[data-locphieu],[data-boloc],[data-buoc],[data-mo],[data-trang],[data-so],[data-tabso],[data-loctt],[data-trangso],[data-tabct],[data-nhac],[data-chep],[data-chaylai],[data-fchieu],#xoaLocSo,#nutFile,#guiForm,#huyForm,#taoTiep');
  if (e.target.id === 'thuLai') { napDuLieu(); return; }
  if (e.target.closest('.hd-lk')) return;
  if (!t || t.disabled) return;
  if (t.tagName === 'A' && !t.dataset.so) return;   // link phiếu: để trình duyệt tự đổi #
  var d = t.dataset;
  if (d.qtthu) { S.thuQt[d.qtthu] = !S.thuQt[d.qtthu]; veTongQuan(); $('[data-qtthu="' + d.qtthu + '"]').focus(); }
  else if (d.qtmo) { var qb = d.qtmo.split(':'); S.ngan = [qb[0], Number(qb[1])]; S.nganTu = d.qtmo; veNgan(); }
  else if (d.dongngan) { S.ngan = null; veNgan(); var vl = $('[data-qtmo="' + S.nganTu + '"]'); if (vl) vl.focus(); }
  else if (d.dv) { S.dv = d.dv; S.trang = 1; veTongQuan(); }
  else if (d.chieu) { S.chieu = d.chieu; S.locBuoc = null; S.trang = 1; veTongQuan(); }
  else if (d.kpi) { var k = d.kpi.split(':'); S.tab = k[0]; if (k[0] === 'can') S.locCanh = k[1]; if (k[0] === 'phieu') { S.locPhieu = k[1]; S.locBuoc = null; } S.trang = 1; veTongQuan(); }
  else if (d.tab) { S.tab = d.tab; veTongQuan(); }
  else if (d.loccanh) { S.locCanh = d.loccanh; veNoiTab(); }
  else if (d.locphieu) { S.locPhieu = d.locphieu; S.trang = 1; veNoiTab(); }
  else if (d.boloc) { S.locBuoc = null; S.trang = 1; veNoiTab(); }
  else if (d.buoc) { var b = d.buoc.split(':'); S.locBuoc = [b[0], Number(b[1])]; S.locPhieu = 'tat'; S.tab = 'phieu'; S.trang = 1; veTongQuan(); }
  else if (d.mo) { location.hash = '#/phieu/' + d.mo; }
  else if (d.trang) { S.trang = Number(d.trang); veNoiTab(); }
  else if (d.so) { e.preventDefault(); S.so = d.so; S.dvSo = d.so.split('|')[1]; S.qSo = ''; S.trangSo = 1; datLaiLocSo(); if (location.hash !== '#/so') location.hash = '#/so'; else veSo(); }
  else if (d.tabso) { S.tabSo = d.tabso; veSo(); }
  else if (d.loctt != null) { S.locTT = d.loctt; S.trangSo = 1; veNoiSo(); }
  else if (d.trangso) { S.trangSo = Number(d.trangso); veDsSoVb(); }
  else if (t.id === 'xoaLocSo') { datLaiLocSo(); S.trangSo = 1; veNoiSo(); }
  else if (d.tabct) { S.tabCt = d.tabct; veChiTiet(S.ctId); }
  else if (d.chep) { try { navigator.clipboard.writeText(d.chep); } catch (x) {} t.textContent = 'Đã sao chép ✓'; }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.ngan) { S.ngan = null; veNgan(); var vl = $('[data-qtmo="' + S.nganTu + '"]'); if (vl) vl.focus(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('canh')) location.hash = '#/phieu/' + e.target.dataset.mo;
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'oTim') { S.q = t.value; S.trang = 1; var vt = t.selectionStart; veNoiTab(); var o = $('#oTim'); o.focus(); o.setSelectionRange(vt, vt); }
  else if (t.id === 'oTimSo') { S.qSo = t.value; $('#dsSo').innerHTML = veDsSo(); }
  else if (t.id === 'oTimSoVb') { S.qSoVb = t.value; S.trangSo = 1; veDsSoVb(); veGoiYSo(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'chonDvSo') { S.dvSo = t.value; S.qSo = ''; chonSoDau(); S.trangSo = 1; datLaiLocSo(); veSo(); }
  else if (t.id === 'chonNam') { S.nam = Number(t.value); S.trangSo = 1; datLaiLocSo(); veSo(); }
});

napDuLieu();
</script>
